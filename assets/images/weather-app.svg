<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050813"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d30"/>
      <stop offset="100%" stop-color="#0f1524"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- Application Window Frame -->
  <g transform="translate(130, 40)" filter="url(#cardShadow)">
    <!-- Window Outer Shell -->
    <rect width="540" height="400" rx="12" fill="url(#windowGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <rect width="540" height="40" rx="12" fill="#1b243b"/>
    <!-- Overwrite bottom rounded corners of titlebar -->
    <rect y="28" width="540" height="12" fill="#1b243b"/>
    <line x1="0" y1="40" x2="540" y2="40" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Window Controls (Traffic lights) -->
    <circle cx="22" cy="20" r="5.5" fill="#ef4444"/>
    <circle cx="38" cy="20" r="5.5" fill="#f59e0b"/>
    <circle cx="54" cy="20" r="5.5" fill="#10b981"/>

    <!-- Window Title -->
    <text x="270" y="24" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Weather App — Python (Tkinter)</text>

    <!-- Tkinter Window Inner Content -->
    <!-- City Search Bar Input -->
    <rect x="70" y="70" width="270" height="42" rx="8" fill="#0b101c" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="90" y="96" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Mumbai, IN</text>

    <!-- Search Button -->
    <rect x="355" y="70" width="115" height="42" rx="8" fill="url(#btnGrad)"/>
    <text x="412" y="96" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Get Weather</text>

    <!-- Weather Display Card -->
    <rect x="70" y="132" width="400" height="185" rx="10" fill="#0c1220" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1"/>

    <!-- Sun & Cloud Illustration -->
    <g transform="translate(110, 165)">
      <!-- Sun -->
      <circle cx="42" cy="38" r="22" fill="#fbbf24"/>
      <!-- Sun rays -->
      <line x1="42" y1="8" x2="42" y2="2" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <line x1="72" y1="38" x2="78" y2="38" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <line x1="63" y1="17" x2="68" y2="12" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <!-- Cloud -->
      <path d="M 30 65 Q 18 65 18 53 Q 18 43 28 41 Q 33 28 48 28 Q 60 28 66 38 Q 78 38 78 50 Q 78 65 62 65 Z" fill="#e2e8f0" opacity="0.95"/>
    </g>

    <!-- Temperature & City Info -->
    <text x="235" y="192" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800">28°C</text>
    <text x="235" y="218" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Scattered Clouds</text>
    <text x="235" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Humidity: 74%  •  Wind: 14 km/h</text>

    <!-- Status Bar / Realtime Clock from Ansh's code -->
    <rect x="70" y="280" width="400" height="37" rx="0" fill="#080c16"/>
    <text x="90" y="303" fill="#64748b" font-family="'Courier New', monospace" font-size="11">STATUS: HTTP 200 OK</text>
    <text x="450" y="303" text-anchor="end" fill="#34d399" font-family="'Courier New', monospace" font-size="12" font-weight="bold">TIME: 18:24:00</text>

    <!-- Footer Technology Pills -->
    <g transform="translate(70, 342)">
      <rect width="78" height="24" rx="4" fill="rgba(255, 255, 255, 0.06)"/>
      <text x="39" y="16" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Python 3</text>

      <rect x="88" width="68" height="24" rx="4" fill="rgba(255, 255, 255, 0.06)"/>
      <text x="122" y="16" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Tkinter</text>

      <rect x="166" width="130" height="24" rx="4" fill="rgba(255, 255, 255, 0.06)"/>
      <text x="231" y="16" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">OpenWeather API</text>

      <rect x="306" width="60" height="24" rx="4" fill="rgba(255, 255, 255, 0.06)"/>
      <text x="336" y="16" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Pillow</text>
    </g>
  </g>
</svg>
