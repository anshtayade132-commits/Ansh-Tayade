<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040612"/>
      <stop offset="60%" stop-color="#091024"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>
    <linearGradient id="headerGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="dataGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#040612" stop-opacity="0"/>
    </radialGradient>
    <filter id="sqlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <circle cx="400" cy="225" r="300" fill="url(#dataGlow)"/>

  <!-- Matrix Grid -->
  <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1"/>
  <path d="M50 0 V450 M100 0 V450 M150 0 V450 M200 0 V450 M250 0 V450 M300 0 V450 M350 0 V450 M400 0 V450 M450 0 V450 M500 0 V450 M550 0 V450 M600 0 V450 M650 0 V450 M700 0 V450 M750 0 V450" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1"/>

  <!-- Foreign Key Relationship Connection Lines -->
  <path d="M 270 175 C 330 175, 330 220, 390 220" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#sqlGlow)"/>
  <path d="M 570 220 C 600 220, 600 310, 620 310" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#sqlGlow)"/>
  <circle cx="270" cy="175" r="5" fill="#38bdf8"/>
  <circle cx="390" cy="220" r="5" fill="#38bdf8"/>
  <circle cx="570" cy="220" r="5" fill="#f43f5e"/>
  <circle cx="620" cy="310" r="5" fill="#f43f5e"/>

  <!-- Table 1: USERS Schema -->
  <g transform="translate(90, 110)">
    <rect width="180" height="150" rx="8" fill="#0b1329" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.5"/>
    <rect width="180" height="32" rx="8" fill="url(#headerGrad1)"/>
    <text x="12" y="21" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="bold" font-size="12" letter-spacing="1">TABLE: USERS</text>
    <text x="15" y="55" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11">PK  user_id (INT)</text>
    <text x="15" y="77" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">    username (VARCHAR)</text>
    <text x="15" y="99" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">    email (VARCHAR)</text>
    <text x="15" y="121" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">    created_at (TIMESTAMP)</text>
    <text x="15" y="143" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11">    role_id (INT)</text>
  </g>

  <!-- Table 2: ORDERS / TRANSACTIONS -->
  <g transform="translate(390, 150)">
    <rect width="180" height="170" rx="8" fill="#0b1329" stroke="rgba(244, 63, 94, 0.5)" stroke-width="1.5"/>
    <rect width="180" height="32" rx="8" fill="url(#headerGrad2)"/>
    <text x="12" y="21" fill="#ffffff" font-family="'Outfit', sans-serif" font-weight="bold" font-size="12" letter-spacing="1">TABLE: ORDERS</text>
    <text x="15" y="55" fill="#f43f5e" font-family="'Courier New', monospace" font-size="11">PK  order_id (INT)</text>
    <text x="15" y="77" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11">FK  user_id (INT)</text>
    <text x="15" y="99" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">    amount (DECIMAL)</text>
    <text x="15" y="121" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">    status (VARCHAR)</text>
    <text x="15" y="143" fill="#cbd5e1" font-family="'Courier New', monospace" font-size="11">    order_date (DATE)</text>
    <text x="15" y="163" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10">INDEX idx_user_date</text>
  </g>

  <!-- SQL Terminal / Query Box -->
  <g transform="translate(100, 310)">
    <rect width="450" height="85" rx="6" fill="#030712" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="15" cy="15" r="4" fill="#ef4444"/>
    <circle cx="28" cy="15" r="4" fill="#f59e0b"/>
    <circle cx="41" cy="15" r="4" fill="#10b981"/>
    <text x="60" y="18" fill="#64748b" font-family="'Courier New', monospace" font-size="10">mysql -u ansh -p --database=enterprise_db</text>
    <text x="15" y="42" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11">SELECT</text>
    <text x="65" y="42" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="11">u.username, COUNT(o.order_id) AS total_orders</text>
    <text x="15" y="60" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11">FROM</text>
    <text x="50" y="60" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="11">users u JOIN orders o ON u.user_id = o.user_id</text>
    <text x="15" y="78" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11">GROUP BY</text>
    <text x="80" y="78" fill="#e2e8f0" font-family="'Courier New', monospace" font-size="11">u.user_id HAVING total_orders &gt; 5;</text>
  </g>

  <!-- Performance Badge -->
  <g transform="translate(620, 260)">
    <rect width="130" height="75" rx="6" fill="#0b1329" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
    <text x="12" y="24" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11">QUERY SPEED</text>
    <text x="12" y="48" fill="#10b981" font-family="'Outfit', sans-serif" font-weight="bold" font-size="20">0.002s</text>
    <text x="12" y="66" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10">INDEXED SCAN</text>
  </g>

  <!-- HUD Title -->
  <text x="50" y="60" fill="#94a3b8" font-family="'Courier New', monospace" font-size="14" letter-spacing="3">MYSQL ENTERPRISE SCHEMAS</text>
  <text x="50" y="85" fill="#38bdf8" font-family="'Courier New', monospace" font-size="12" letter-spacing="2">NORMALIZATION (3NF) // TRIGGERS // VIEWS</text>

  <!-- Corner Brackets -->
  <path d="M 30 50 L 30 30 L 50 30" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 770 50 L 770 30 L 750 30" stroke="#f43f5e" stroke-width="2" fill="none"/>
  <path d="M 30 400 L 30 420 L 50 420" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 770 400 L 770 420 L 750 420" stroke="#f43f5e" stroke-width="2" fill="none"/>
</svg>
