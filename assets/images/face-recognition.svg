<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="100%" stop-color="#03050c"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2f"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>
    <linearGradient id="camGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)"/>
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.45)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- Desktop Application Window Frame -->
  <g transform="translate(40, 24)" filter="url(#boxShadow)">
    <rect width="720" height="432" rx="14" fill="url(#windowGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <rect width="720" height="42" rx="14" fill="#182238"/>
    <rect y="30" width="720" height="12" fill="#182238"/>
    <line x1="0" y1="42" x2="720" y2="42" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Window Control Dots -->
    <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5.5" fill="#f59e0b"/>
    <circle cx="60" cy="21" r="5.5" fill="#10b981"/>

    <!-- Window Title -->
    <text x="360" y="26" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      Face Recognition &amp; Biometric Verification System (OpenCV · face_recognition · MySQL)
    </text>

    <!-- MAIN BODY SPLIT: Camera Feed (Left) & SQL Database Record (Right) -->

    <!-- ==================== LEFT: LIVE WEBCAM FEED ==================== -->
    <g transform="translate(24, 60)">
      <!-- Camera Viewport Box -->
      <rect width="400" height="344" rx="10" fill="url(#camGrad)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>

      <!-- Viewfinder Corner Brackets -->
      <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <path d="M 388 28 L 388 12 L 372 12" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <path d="M 12 316 L 12 332 L 28 332" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <path d="M 388 316 L 388 332 L 372 332" fill="none" stroke="#38bdf8" stroke-width="2.5"/>

      <!-- Grid Overlay Lines -->
      <line x1="133" y1="0" x2="133" y2="344" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
      <line x1="266" y1="0" x2="266" y2="344" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
      <line x1="0" y1="114" x2="400" y2="114" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
      <line x1="0" y1="228" x2="400" y2="228" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>

      <!-- Camera Header Pill -->
      <g transform="translate(18, 16)">
        <circle cx="8" cy="8" r="4.5" fill="#ef4444"/>
        <text x="20" y="12" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">REC [LIVE 30 FPS]</text>
        <text x="260" y="12" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">640×480 RGB</text>
      </g>

      <!-- Center Face Mesh & Bounding Box -->
      <g transform="translate(115, 68)">
        <!-- Face Silhouette -->
        <ellipse cx="85" cy="100" rx="60" ry="75" fill="rgba(14, 165, 233, 0.08)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" stroke-dasharray="4 3"/>

        <!-- Facial Landmark Mesh (Eyes, Nose, Mouth Nodes) -->
        <g stroke="#38bdf8" stroke-width="1" fill="#38bdf8" opacity="0.85">
          <!-- Left Eye Mesh -->
          <circle cx="62" cy="85" r="2.5"/>
          <circle cx="72" cy="85" r="2.5"/>
          <line x1="62" y1="85" x2="72" y2="85"/>

          <!-- Right Eye Mesh -->
          <circle cx="98" cy="85" r="2.5"/>
          <circle cx="108" cy="85" r="2.5"/>
          <line x1="98" y1="85" x2="108" y2="85"/>

          <!-- Nose Ridge & Tip -->
          <circle cx="85" cy="98" r="2"/>
          <circle cx="85" cy="112" r="2.5"/>
          <line x1="85" y1="98" x2="85" y2="112"/>

          <!-- Lips / Smile Mesh -->
          <circle cx="68" cy="132" r="2"/>
          <circle cx="85" cy="136" r="2.5"/>
          <circle cx="102" cy="132" r="2"/>
          <path d="M 68 132 Q 85 140 102 132" fill="none" stroke="#38bdf8" stroke-width="1.2"/>

          <!-- Jawline Contours -->
          <circle cx="45" cy="115" r="1.5"/>
          <circle cx="55" cy="148" r="1.5"/>
          <circle cx="85" cy="162" r="2"/>
          <circle cx="115" cy="148" r="1.5"/>
          <circle cx="125" cy="115" r="1.5"/>
          <path d="M 45 115 L 55 148 L 85 162 L 115 148 L 125 115" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
        </g>

        <!-- OpenCV Green Bounding Box -->
        <rect x="15" y="15" width="140" height="170" rx="4" fill="none" stroke="#10b981" stroke-width="2" filter="url(#neonGlow)"/>

        <!-- Bounding Box Corner Target Accents -->
        <path d="M 15 32 L 15 15 L 32 15" fill="none" stroke="#34d399" stroke-width="3"/>
        <path d="M 155 32 L 155 15 L 138 15" fill="none" stroke="#34d399" stroke-width="3"/>
        <path d="M 15 168 L 15 185 L 32 185" fill="none" stroke="#34d399" stroke-width="3"/>
        <path d="M 155 168 L 155 185 L 138 185" fill="none" stroke="#34d399" stroke-width="3"/>

        <!-- Horizontal Laser Scan Beam -->
        <rect x="15" y="90" width="140" height="8" fill="url(#scanBeam)"/>
        <line x1="15" y1="94" x2="155" y2="94" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>

        <!-- Real-Time Floating Badge on Detection Box -->
        <g transform="translate(15, -12)">
          <rect width="140" height="24" rx="4" fill="#10b981"/>
          <text x="70" y="16" text-anchor="middle" fill="#042f2e" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="800">
            P001 · ANSH TAYADE
          </text>
        </g>

        <!-- Match Metric Pill -->
        <g transform="translate(25, 192)">
          <rect width="120" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
          <text x="60" y="14" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">
            CONFIDENCE: 98.6%
          </text>
        </g>
      </g>

      <!-- Viewport Bottom Status Bar -->
      <g transform="translate(18, 318)">
        <text x="0" y="0" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">● Haar Cascade &amp; HOG Detector: Active</text>
        <text x="250" y="0" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Dist: 0.380 (&lt;0.6)</text>
      </g>
    </g>

    <!-- ==================== RIGHT: MYSQL DATABASE TELEMETRY ==================== -->
    <g transform="translate(444, 60)">
      <!-- Right Container Card -->
      <rect width="252" height="344" rx="10" fill="#090f1d" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

      <!-- Database Header -->
      <g transform="translate(16, 20)">
        <rect width="32" height="32" rx="8" fill="rgba(2, 132, 199, 0.18)" stroke="#0284c7" stroke-width="1"/>
        <text x="16" y="21" text-anchor="middle" fill="#38bdf8" font-size="16">🗄️</text>
        <text x="42" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">MySQL Database</text>
        <text x="42" y="28" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9.5">● Connected: face_db</text>
      </g>

      <!-- SQL Query Badge -->
      <g transform="translate(16, 68)">
        <rect width="220" height="34" rx="6" fill="#03060f" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
        <text x="10" y="16" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">SQL QUERY EXECUTION:</text>
        <text x="10" y="27" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8.8">SELECT * FROM persons...</text>
      </g>

      <!-- Record Key-Value Details Table -->
      <g transform="translate(16, 116)">
        <rect width="220" height="154" rx="6" fill="#0d1424" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1"/>

        <!-- Row 1: Person ID -->
        <g transform="translate(12, 22)">
          <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">PERSON_ID:</text>
          <text x="196" y="0" text-anchor="end" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700">P001</text>
          <line x1="0" y1="8" x2="196" y2="8" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
        </g>

        <!-- Row 2: Name -->
        <g transform="translate(12, 44)">
          <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">NAME:</text>
          <text x="196" y="0" text-anchor="end" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700">Ansh Tayade</text>
          <line x1="0" y1="8" x2="196" y2="8" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
        </g>

        <!-- Row 3: Age & Gender -->
        <g transform="translate(12, 66)">
          <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">AGE / GENDER:</text>
          <text x="196" y="0" text-anchor="end" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">20 / Male</text>
          <line x1="0" y1="8" x2="196" y2="8" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
        </g>

        <!-- Row 4: Phone -->
        <g transform="translate(12, 88)">
          <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">PHONE:</text>
          <text x="196" y="0" text-anchor="end" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">7821851091</text>
          <line x1="0" y1="8" x2="196" y2="8" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
        </g>

        <!-- Row 5: City -->
        <g transform="translate(12, 110)">
          <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">CITY:</text>
          <text x="196" y="0" text-anchor="end" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10">Bhusawal</text>
          <line x1="0" y1="8" x2="196" y2="8" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
        </g>

        <!-- Row 6: Match Status -->
        <g transform="translate(12, 132)">
          <text x="0" y="0" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">MATCH STATUS:</text>
          <text x="196" y="0" text-anchor="end" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">VERIFIED ✓</text>
        </g>
      </g>

      <!-- Bottom Tech Badge Pills -->
      <g transform="translate(16, 286)">
        <rect width="105" height="24" rx="4" fill="rgba(14, 165, 233, 0.12)" stroke="rgba(14, 165, 233, 0.3)" stroke-width="1"/>
        <text x="52" y="16" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">128-D VECTORS</text>

        <rect x="115" width="105" height="24" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
        <text x="167" y="16" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5">.ENV SECURED</text>
      </g>

      <g transform="translate(16, 318)">
        <text x="110" y="12" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">
          dlib · OpenCV 4.x · MySQL Connector
        </text>
      </g>
    </g>

  </g>
</svg>
