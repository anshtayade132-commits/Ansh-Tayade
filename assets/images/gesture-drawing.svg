<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040612"/>
      <stop offset="50%" stop-color="#0a1026"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>
    <radialGradient id="meshGlow" cx="55%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#040612" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <circle cx="450" cy="225" r="260" fill="url(#meshGlow)"/>

  <!-- 3D Perspective Grid -->
  <g stroke="rgba(56, 189, 248, 0.12)" stroke-width="1">
    <line x1="100" y1="400" x2="400" y2="240"/>
    <line x1="250" y1="400" x2="400" y2="240"/>
    <line x1="400" y1="400" x2="400" y2="240"/>
    <line x1="550" y1="400" x2="400" y2="240"/>
    <line x1="700" y1="400" x2="400" y2="240"/>

    <ellipse cx="400" cy="360" rx="350" ry="60" fill="none"/>
    <ellipse cx="400" cy="320" rx="250" ry="40" fill="none"/>
    <ellipse cx="400" cy="280" rx="150" ry="24" fill="none"/>
  </g>

  <!-- 3D Freehand Ribbon Drawn in Space -->
  <path d="M 180 320 Q 240 120 340 180 T 480 140 T 620 280 T 680 160" fill="none" stroke="#e11d48" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)"/>
  <path d="M 185 325 Q 245 125 345 185 T 485 145 T 625 285 T 685 165" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.8"/>
  <path d="M 210 260 Q 300 80 430 190 T 560 210" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" filter="url(#neonGlow)"/>

  <!-- MediaPipe Hand Tracking Skeleton & Landmarks -->
  <!-- Wrist -->
  <circle cx="340" cy="340" r="5" fill="#38bdf8" filter="url(#neonGlow)"/>
  <!-- Thumb -->
  <line x1="340" y1="340" x2="310" y2="300" stroke="#38bdf8" stroke-width="2"/>
  <line x1="310" y1="300" x2="290" y2="260" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="310" cy="300" r="4" fill="#38bdf8"/>
  <circle cx="290" cy="260" r="5" fill="#f43f5e" filter="url(#neonGlow)"/>

  <!-- Index Finger (Drawing Tip) -->
  <line x1="340" y1="340" x2="335" y2="260" stroke="#38bdf8" stroke-width="2"/>
  <line x1="335" y1="260" x2="340" y2="180" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="335" cy="260" r="4" fill="#38bdf8"/>
  <circle cx="340" cy="180" r="9" fill="#e11d48" filter="url(#neonGlow)"/>
  <circle cx="340" cy="180" r="18" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>

  <!-- Middle Finger -->
  <line x1="340" y1="340" x2="370" y2="270" stroke="#38bdf8" stroke-width="2"/>
  <line x1="370" y1="270" x2="385" y2="220" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="370" cy="270" r="4" fill="#38bdf8"/>
  <circle cx="385" cy="220" r="4" fill="#38bdf8"/>

  <!-- Ring Finger -->
  <line x1="340" y1="340" x2="400" y2="290" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="400" y1="290" x2="420" y2="250" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="400" cy="290" r="3" fill="#38bdf8"/>
  <circle cx="420" cy="250" r="3" fill="#38bdf8"/>

  <!-- Pinky -->
  <line x1="340" y1="340" x2="425" y2="315" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="425" y1="315" x2="445" y2="285" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="425" cy="315" r="3" fill="#38bdf8"/>
  <circle cx="445" cy="285" r="3" fill="#38bdf8"/>

  <!-- HUD Interface Details -->
  <text x="50" y="60" fill="#94a3b8" font-family="'Courier New', monospace" font-size="14" letter-spacing="3">OPENCV + MEDIAPIPE 3D</text>
  <text x="50" y="85" fill="#38bdf8" font-family="'Courier New', monospace" font-size="12" letter-spacing="2">GESTURE TRACKING: 60 FPS // 21 LANDMARKS</text>

  <rect x="580" y="40" width="180" height="90" rx="6" fill="#0b1329" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
  <text x="595" y="65" fill="#e11d48" font-family="'Courier New', monospace" font-size="11">ACTIVE MODE: DRAW</text>
  <text x="595" y="85" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10">INDEX TIP: (X:340, Y:180, Z:12)</text>
  <text x="595" y="105" fill="#38bdf8" font-family="'Courier New', monospace" font-size="10">GESTURE: PINCH SELECT</text>

  <!-- Framing -->
  <path d="M 30 50 L 30 30 L 50 30" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 770 50 L 770 30 L 750 30" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 30 400 L 30 420 L 50 420" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 770 400 L 770 420 L 750 420" stroke="#38bdf8" stroke-width="2" fill="none"/>
</svg>
