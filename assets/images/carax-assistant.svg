<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050813"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d30"/>
      <stop offset="100%" stop-color="#0f1524"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- Desktop Application Window Frame -->
  <g transform="translate(130, 40)" filter="url(#cardShadow)">
    <rect width="540" height="400" rx="12" fill="url(#windowGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

    <!-- Window Titlebar -->
    <rect width="540" height="40" rx="12" fill="#1b243b"/>
    <rect y="28" width="540" height="12" fill="#1b243b"/>
    <line x1="0" y1="40" x2="540" y2="40" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="22" cy="20" r="5.5" fill="#ef4444"/>
    <circle cx="38" cy="20" r="5.5" fill="#f59e0b"/>
    <circle cx="54" cy="20" r="5.5" fill="#10b981"/>

    <!-- Window Title -->
    <text x="270" y="24" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Carax Voice Assistant (Python)</text>

    <!-- Top Mic & Status Bar -->
    <rect x="40" y="60" width="460" height="65" rx="8" fill="#0b101c" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Microphone Icon Circle -->
    <g transform="translate(62, 77)">
      <circle cx="16" cy="16" r="18" fill="rgba(225, 29, 72, 0.15)" stroke="#e11d48" stroke-width="1.5"/>
      <!-- Mic Shape -->
      <rect x="12" y="8" width="8" height="12" rx="4" fill="#ffffff"/>
      <path d="M 8 16 A 8 8 0 0 0 24 16" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="16" y1="24" x2="16" y2="28" stroke="#ffffff" stroke-width="1.5"/>
    </g>

    <!-- Status Info -->
    <text x="110" y="88" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Carax Voice Assistant</text>
    <text x="110" y="108" fill="#34d399" font-family="'Courier New', monospace" font-size="12">● Status: Listening for speech input...</text>

    <!-- Mini Audio Waveform -->
    <g transform="translate(390, 85)" fill="#e11d48">
      <rect x="0" y="6" width="3" height="12" rx="1.5"/>
      <rect x="7" y="2" width="3" height="20" rx="1.5"/>
      <rect x="14" y="0" width="3" height="24" rx="1.5"/>
      <rect x="21" y="4" width="3" height="16" rx="1.5"/>
      <rect x="28" y="7" width="3" height="10" rx="1.5"/>
      <rect x="35" y="1" width="3" height="22" rx="1.5"/>
      <rect x="42" y="5" width="3" height="14" rx="1.5"/>
      <rect x="49" y="8" width="3" height="8" rx="1.5"/>
    </g>

    <!-- Dialogue / Command Execution Log Area -->
    <rect x="40" y="140" width="460" height="180" rx="8" fill="#080c16" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>

    <!-- Message 1: User Voice Command -->
    <g transform="translate(60, 160)">
      <rect width="280" height="32" rx="6" fill="#1e293b"/>
      <text x="12" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">🎤 User: "Carax, what is the time?"</text>
    </g>

    <!-- Message 2: Assistant Voice Output -->
    <g transform="translate(180, 202)">
      <rect width="300" height="32" rx="6" fill="rgba(225, 29, 72, 0.2)" stroke="rgba(225, 29, 72, 0.3)" stroke-width="1"/>
      <text x="12" y="21" fill="#fecdd3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">🔊 Carax: "The current time is 6:15 PM."</text>
    </g>

    <!-- Message 3: Second User Command -->
    <g transform="translate(60, 244)">
      <rect width="320" height="32" rx="6" fill="#1e293b"/>
      <text x="12" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">🎤 User: "Open YouTube and search Python"</text>
    </g>

    <!-- Message 4: Assistant Reaction -->
    <g transform="translate(180, 286)">
      <rect width="300" height="26" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="12" y="17" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">🚀 Action: Launching browser search...</text>
    </g>

    <!-- Footer Technology Pills -->
    <g transform="translate(40, 342)">
      <rect width="78" height="24" rx="4" fill="rgba(255, 255, 255, 0.06)"/>
      <text x="39" y="16" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Python 3</text>

      <rect x="88" width="138" height="24" rx="4" fill="rgba(255, 255, 255, 0.06)"/>
      <text x="157" y="16" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">SpeechRecognition</text>

      <rect x="236" width="70" height="24" rx="4" fill="rgba(255, 255, 255, 0.06)"/>
      <text x="271" y="16" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">pyttsx3</text>

      <rect x="316" width="90" height="24" rx="4" fill="rgba(255, 255, 255, 0.06)"/>
      <text x="361" y="16" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Web Browser</text>
    </g>
  </g>
</svg>
